server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root __PORTAL_DIR__;
    index index.html index.php;
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
    location = /generate_204        { return 302 http://__AP_IP__/; }
    location = /hotspot-detect.html { return 302 http://__AP_IP__/; }
    location = /connecttest.txt     { return 302 http://__AP_IP__/; }
    location = /redirect            { return 302 http://__AP_IP__/; }
}
